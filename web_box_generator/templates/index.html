<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 模型查看与测量系统</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <style>
        :root {
            --primary:#4f8cf7; --primary-dark:#3a6fd8; --primary-bg:#eaf1ff;
            --bg:#f0f2f5; --surface:#fff; --border:#dde1e7; --text:#1b2534; --text2:#68748a; --text3:#9aa7ba;
            --shadow:0 2px 10px rgba(0,0,0,0.07); --radius:8px;
        }
        * {margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI','Microsoft YaHei',system-ui,sans-serif;background:var(--bg);height:100vh;overflow:hidden;color:var(--text)}
        /* ===== Header ===== */
        .header{height:50px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 12px;gap:10px;flex-shrink:0;z-index:50}
        .logo{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,#4f8cf7,#6c5ce7);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
        .logo-txt{font-weight:700;font-size:15px}
        .logo-sub{font-size:11px;color:var(--text3);padding-left:8px;border-left:1px solid var(--border)}
        .spacer{flex:1}
        .header-actions{display:flex;gap:6px}
        .ha-btn{padding:7px 12px;border:1px solid var(--border);background:var(--bg);border-radius:7px;cursor:pointer;font-size:12.5px;color:var(--text2);transition:.15s}
        .ha-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-bg)}
        .ha-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
        .auto-clean-toggle{display:flex;align-items:center;gap:5px;padding:7px 10px;border:1px solid var(--border);background:var(--bg);border-radius:7px;font-size:12px;color:var(--text2);cursor:pointer;white-space:nowrap;transition:.15s}
        .auto-clean-toggle:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-bg)}
        .auto-clean-toggle input{accent-color:var(--primary);cursor:pointer}
        /* ===== Layout ===== */
        .layout{display:flex;height:calc(100vh - 50px)}
        /* ===== Left tree panel ===== */
        .tree-panel{width:260px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
        /* 左侧功能模块列表 */
        .fn-list{display:flex;flex-direction:column;gap:3px;padding:8px;border-bottom:1px solid var(--border);flex-shrink:0}
        .fn-btn{padding:8px 10px;border:none;background:var(--bg);border-radius:6px;cursor:pointer;font-size:12.5px;color:var(--text2);text-align:left;transition:.15s}
        .fn-btn:hover{background:var(--primary-bg);color:var(--primary)}
        .fn-btn.active{background:var(--primary);color:#fff}
        .tree-head{padding:10px 14px;font-weight:700;font-size:13px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
        .tree-head .badge{font-size:10px;background:var(--primary-bg);color:var(--primary);padding:1px 7px;border-radius:10px;font-weight:600}
        .tree-box{flex:1;overflow-y:auto;padding:6px}
        .tree-box::-webkit-scrollbar{width:5px}
        .tree-box::-webkit-scrollbar-thumb{background:#ccd2dc;border-radius:3px}
        .tree-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:12.8px;user-select:none}
        .tree-item:hover{background:var(--primary-bg)}
        .tree-item.sel{background:var(--primary-bg);box-shadow:inset 2px 0 0 var(--primary)}
        .tree-item .sw{width:13px;height:13px;border-radius:3px;border:1px solid rgba(0,0,0,.25);flex-shrink:0}
        .tree-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .tree-item .tri{font-size:10.5px;color:var(--text3)}
        .tree-item .eye{cursor:pointer;font-size:13px;color:var(--text3);width:18px;text-align:center;border-radius:4px}
        .tree-item .eye:hover{background:#fff;color:var(--text)}
        .tree-item .lens{cursor:pointer;font-size:13px;color:var(--text3);width:18px;text-align:center;border-radius:4px}
        .tree-item .lens:hover{background:#fff;color:var(--primary)}
        .tree-foot{padding:8px;border-top:1px solid var(--border);display:flex;gap:6px}
        .tf-btn{flex:1;padding:6px;font-size:11.5px;border:1px solid var(--border);background:var(--bg);border-radius:6px;cursor:pointer;color:var(--text2)}
        .tf-btn:hover{color:var(--primary);border-color:var(--primary)}
        /* ===== Viewer ===== */
        .viewer-wrap{flex:1;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#94a7bf 0%,#6b7c95 100%)}
        #viewer{width:100%;height:100%}
        /* top-right toolbar */
        .vtool{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:3px;z-index:10}
        .vtool button{width:44px;height:44px;border:1px solid rgba(255,255,255,.6);background:rgba(255,255,255,.82);backdrop-filter:blur(8px);border-radius:7px;cursor:pointer;font-size:17px;box-shadow:var(--shadow);transition:.15s}
        .vtool button:hover{background:#fff;transform:translateY(-1px)}
        .vtool button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
        .vtool .sep{height:1px;background:var(--border);margin:2px 8px}
        /* bottom toolbar */
        .btool{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:3px;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border-radius:12px;padding:5px 8px;box-shadow:var(--shadow);z-index:10;border:1px solid rgba(255,255,255,.6)}
        .btool button{width:42px;height:42px;border:none;background:transparent;border-radius:7px;cursor:pointer;font-size:17px;color:#5a6678;transition:.15s}
        .btool button:hover{background:rgba(0,0,0,.06)}
        .btool button.active{background:var(--primary);color:#fff}
        .btool .sep{width:1px;background:var(--border);margin:0 3px}
        /* view cube */
        .viewcube{position:absolute;bottom:70px;right:12px;width:74px;height:74px;z-index:10;background:rgba(255,255,255,.8);backdrop-filter:blur(8px);border-radius:7px;display:flex;flex-wrap:wrap;overflow:hidden;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.6)}
        .viewcube div{width:33.33%;height:33.33%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#5a6678;cursor:pointer;border:1px solid rgba(0,0,0,.03);transition:.12s}
        .viewcube div:hover{background:var(--primary-bg);color:var(--primary)}
        .viewcube div.home{background:var(--primary);color:#fff}
        /* status bar */
        .status{position:absolute;bottom:0;left:0;right:0;height:22px;background:rgba(20,28,40,.18);backdrop-filter:blur(3px);font-size:11px;color:#eef2f8;display:flex;align-items:center;gap:14px;padding:0 12px;z-index:10;pointer-events:none}
        .status .sp{color:rgba(255,255,255,.35)}
        .status .tri{margin-left:auto}
        /* property panel */
        .prop-panel{position:absolute;top:10px;left:10px;width:250px;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-radius:10px;box-shadow:var(--shadow);padding:12px 14px;z-index:20;display:none;font-size:12.3px;border:1px solid rgba(255,255,255,.7)}
        .prop-panel h4{font-size:12.8px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
        .prop-panel .row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed var(--border)}
        .prop-panel .row .k{color:var(--text2)}
        .prop-panel .row .v{font-weight:600}
        .prop-close{background:none;border:none;cursor:pointer;font-size:13px;color:var(--text3);margin-left:auto}
        .prop-close:hover{color:var(--text)}
        /* loading */
        .loading{position:absolute;inset:0;background:rgba(30,40,55,.35);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:100}
        .loading.show{display:flex}
        .spin{width:38px;height:38px;border:3px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:sp 0.8s linear infinite}
        @keyframes sp{to{transform:rotate(360deg)}}
        /* side panels (工程功能) */
        .panel-backdrop{position:absolute;inset:0;z-index:29;background:rgba(0,0,0,.12);display:none}
        .panel-backdrop.show{display:block}
        .panels{position:absolute;left:0;top:0;bottom:0;width:280px;background:var(--surface);border-right:1px solid var(--border);z-index:30;display:none;flex-direction:column;box-shadow:3px 0 18px rgba(0,0,0,.08)}
        .panels.show{display:flex}
        .panels .ph{padding:12px 14px;border-bottom:1px solid var(--border);font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:8px}
        .panels .ph button{margin-left:auto;background:none;border:none;cursor:pointer;font-size:15px;color:var(--text3)}
        .panels .pb{flex:1;overflow-y:auto;padding:14px}
        /* 多面板：右侧容器内可纵向堆叠多个同时打开的面板卡片 */
        .panels .panel-stack{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:0}
        .panels .panel-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);display:none;flex-direction:column;flex-shrink:0;min-height:0}
        .panels .panel-card.show{display:flex}
        .panels .panel-card .ph{padding:10px 12px;border-bottom:1px solid var(--border);font-weight:700;font-size:13px;display:flex;align-items:center;gap:8px;flex-shrink:0}
        .panels .panel-card .ph button{margin-left:auto;background:none;border:none;cursor:pointer;font-size:15px;color:var(--text3)}
        .panels .panel-card .pb{flex:0 0 auto;overflow-y:auto;padding:12px}
        /* 装配·拼合 面板 */
        .asm-part{border:1px solid var(--border);border-radius:8px;padding:10px;margin:10px 0}
        .asm-part label.f{margin-top:8px}
        .asm-part .asm-row{display:flex;align-items:center;gap:6px;font-size:12.5px;margin-top:8px;color:var(--text2)}
        .asm-part .asm-offv{font-weight:700;color:var(--primary-dark)}
        .asm-part input[type=range]{margin-top:2px}
        .panels label.f{display:block;font-size:12px;font-weight:600;margin:10px 0 4px}
        .panels input[type=number],.panels input[type=text],.panels select{width:100%;padding:8px 10px;border:1.4px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;outline:none}
        .panels input:focus{border-color:var(--primary)}
        .btn{display:block;width:100%;padding:9px;border:none;border-radius:7px;background:linear-gradient(135deg,#4f8cf7,#6c5ce7);color:#fff;font-size:13px;font-weight:600;cursor:pointer;margin-top:12px;transition:.2s}
        .btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(79,140,247,.35)}
        .btn.small{padding:7px;font-size:12px}
        .panels .hint{font-size:11.5px;color:var(--text3);margin-top:5px;line-height:1.5}
        .status-msg{border-radius:7px;padding:8px 10px;font-size:12px;margin-top:10px;display:none;line-height:1.5}
        .status-msg.show{display:block}
        .status-msg.ok{background:#e9f9ef;color:#0a6e35;border:1px solid #b7ecd0}
        .status-msg.err{background:#fdecec;color:#a11;border:1px solid #f6c6c6}
        .status-msg.info{background:var(--primary-bg);color:var(--primary-dark);border:1px solid #c9ddfd}
        .panel-body label.f:first-child{margin-top:0}
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">3D</div>
        <div class="logo-txt">三维模型查看系统</div>
        <span class="logo-sub">OpenCASCADE</span>
        <div class="spacer"></div>
        <div class="header-actions">
            <button class="ha-btn" data-panel="upload">📂 上传模型</button>
            <button class="ha-btn" data-panel="measure">📏 测量</button>
            <button class="ha-btn" data-panel="cutplane">✂️ 剖切</button>
            <button class="ha-btn" data-panel="mold">🔨 模具</button>
            <button class="ha-btn" data-panel="mirror">🪞 镜像与旋转</button>
            <button class="ha-btn" data-panel="corner">🔧 角落闭合</button>
            <button class="ha-btn" data-panel="refix">🛠 模具再修理</button>
            <button class="ha-btn" data-panel="assembly">🧩 装配</button>
            <button class="ha-btn" data-panel="contact">📐 形变配合面</button>
            <button class="ha-btn" data-panel="m2">🏭 模具自动生成</button>
            <button class="ha-btn" data-panel="holefill">🕳 孔洞补齐</button>
            <label class="auto-clean-toggle" title="开启后：每次生成结束保留最终 .stp，自动清除几何缓存 JSON 与再修理中间件"><input type="checkbox" id="autoCleanChk"> 🧹 自动清理中间产物</label>
        </div>
    </div>
    <div class="layout">
        <!-- 左侧：功能模块 + 模型树 -->
        <div class="tree-panel">
            <div class="fn-list" id="fnList">
                <button class="fn-btn" data-panel="upload">📂 上传模型</button>
                <button class="fn-btn" data-panel="measure">📏 测量</button>
                <button class="fn-btn" data-panel="cutplane">✂️ 剖切</button>
                <button class="fn-btn" data-panel="mold">🔨 模具</button>
                <button class="fn-btn" data-panel="mirror">🪞 镜像与旋转</button>
                <button class="fn-btn" data-panel="corner">🔧 角落闭合</button>
                <button class="fn-btn" data-panel="refix">🛠 模具再修理</button>
                <button class="fn-btn" data-panel="assembly">🧩 装配</button>
                <button class="fn-btn" data-panel="contact">📐 形变配合面</button>
                <button class="fn-btn" data-panel="m2">🏭 模具自动生成</button>
                <button class="fn-btn" data-panel="holefill">🕳 孔洞补齐</button>
            </div>
            <div class="tree-head">🎄 模型树 <span class="badge" id="treeCount">0 实体</span></div>
            <div class="tree-box" id="treeBox"><div style="color:var(--text3);font-size:12px;padding:10px">尚未加载模型 — 点击上方「上传模型」</div></div>
            <div class="tree-foot">
                <button class="tf-btn" id="showAllBtn">👁 全部显示</button>
                <button class="tf-btn" id="hideAllBtn">🚫 全部隐藏</button>
            </div>
        </div>
        <!-- 3D 视图 -->
        <div class="viewer-wrap">
            <div id="viewer"></div>
            <div class="loading" id="loading"><div class="spin"></div></div>
            <!-- 右侧工具 -->
            <div class="vtool">
                <button id="fitBtn" title="适配模型">⊞</button>
                <button id="axisBtn" title="坐标轴">⊕</button>
                <div class="sep"></div>
                <button id="isoBtn" title="等轴测">◈</button>
                <button id="frontBtn" title="前视图">▣</button>
                <button id="topBtn" title="俯视图">▤</button>
                <button id="leftBtn" title="左视图">▥</button>
            </div>
            <!-- 底部工具 -->
            <div class="btool">
                <button id="rotateBtn" title="自动旋转" class="active">⟳</button>
                <button id="gridBtn" title="网格" class="active">⊞</button>
                <button id="wireBtn" title="线框 (W)">◇</button>
                <button id="edgeBtn" title="边线 (E)" class="active">‖</button>
                <div class="sep"></div>
                <button id="panBtn" title="平移模式：点击后用左键拖动平移 (P)">✥</button>
                <button id="liveBtn" title="实时位置：鼠标悬停显示所在封闭面 (L)">◎</button>
                <button id="markBtn" title="表面标注：上红/下蓝/侧橙 (S)">🎨</button>
                <div class="sep"></div>
                <button id="semiBtn" title="半透明">◐</button>
                <button id="matBtn" title="材质">🧪</button>
            </div>
            <!-- 视图立方体 -->
            <div class="viewcube" id="viewcube">
                <div data-v="front">前</div><div data-v="top">上</div><div data-v="right">右</div>
                <div data-v="bottom">下</div><div class="home" data-v="home">3D</div><div data-v="left">左</div>
                <div data-v="back">后</div><div data-v="iso">轴</div><div data-v="reset">复</div>
            </div>
            <!-- 属性面板 -->
            <div class="prop-panel" id="propPanel">
                <h4>🔍 选中对象 <button class="prop-close" onclick="closeProp()">✕</button></h4>
                <div id="propBody"></div>
            </div>
            <!-- 状态栏 -->
            <div class="status">
                <span id="stMode">就绪</span><span class="sp">|</span><span id="stInfo">无模型</span><span class="sp">|</span>
                <span>拖拽旋转 · 滚轮缩放 · 右键平移</span><span class="tri" id="stTri"></span>
            </div>
            <!-- 面板遮罩层（点击关闭全部面板） -->
            <div class="panel-backdrop" id="panelBackdrop" onclick="closeAllPanels()"></div>
            <!-- 工程功能面板（可多个同时打开，纵向堆叠） -->
            <div class="panels" id="panels">
                <div class="panel-stack" id="panelStack"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { Line2 } from 'three/addons/lines/Line2.js';
        import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
        import { LineGeometry } from 'three/addons/lines/LineGeometry.js';
        import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
        import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
        import { FXAAShader } from 'three/addons/shaders/FXAAShader.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

        /* ================= 场景 ================= */
        const container = document.getElementById('viewer');
        const scene = new THREE.Scene();
        // 竖向渐变背景（顶部冷灰蓝、底部亮白），比纯色更有层次，衬托实体轮廓
        (function(){
            const c=document.createElement('canvas'); c.width=2; c.height=512;
            const g=c.getContext('2d'); const grd=g.createLinearGradient(0,0,0,512);
            grd.addColorStop(0,'#e9ebee'); grd.addColorStop(0.5,'#f1f2f4'); grd.addColorStop(1,'#fafbfc');
            g.fillStyle=grd; g.fillRect(0,0,2,512);
            const tx=new THREE.CanvasTexture(c); tx.colorSpace=THREE.SRGBColorSpace;
            scene.background=tx;
        })();
        const camera = new THREE.PerspectiveCamera(40, container.clientWidth/container.clientHeight, 0.1, 1e6);
        camera.position.set(180,140,240);
        const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
        renderer.setSize(container.clientWidth, container.clientHeight);
        // 像素比上限 2.0：4K 屏也不至于让 GPU 填充压力过大导致卡顿
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2.0));
        renderer.toneMapping = THREE.NoToneMapping;   // CAD 工程图风格：平直明亮，避免 ACES 压暗/高对比
        renderer.toneMappingExposure = 1.0;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.samples = 4;
        container.appendChild(renderer.domElement);

        // 实体感关键：HDR 环境反射贴图。
        // 让材质反射环境光形成连续流动的高光，曲面不再灰平发虚，而是像真实实体一样有立体光泽
        {
            const pmrem = new THREE.PMREMGenerator(renderer);
            const envScene = new RoomEnvironment();
            scene.environment = pmrem.fromScene(envScene, 0.04).texture;
            pmrem.dispose();
        }

        // CAD 工程图风格布光：柔和、低对比，避免强高光/硬阴影
        scene.add(new THREE.AmbientLight(0xffffff, 0.75));
        scene.add(new THREE.HemisphereLight(0xffffff, 0xdfe3e8, 0.55));
        const key = new THREE.DirectionalLight(0xffffff, 0.75); key.position.set(180,300,240); scene.add(key);
        const fill = new THREE.DirectionalLight(0xffffff, 0.35); fill.position.set(-220,120,-160); scene.add(fill);
        const rim = new THREE.DirectionalLight(0xffffff, 0.4); rim.position.set(-60,180,-260); scene.add(rim);
        const bot = new THREE.DirectionalLight(0xdde3ea, 0.2); bot.position.set(0,-240,0); scene.add(bot);
        const grid = new THREE.GridHelper(200,20,0xc9d2da,0xe2e7ec); scene.add(grid);
        // 地面软阴影：径向渐变圆盘置于模型正下方，提供“落地”与景深（无需真实阴影映射，零性能损耗）
        const groundShadow = (function(){
            const c=document.createElement('canvas'); c.width=c.height=256;
            const g=c.getContext('2d'); const grd=g.createRadialGradient(128,128,10,128,128,128);
            grd.addColorStop(0,'rgba(40,52,72,0.45)'); grd.addColorStop(0.55,'rgba(40,52,72,0.2)'); grd.addColorStop(1,'rgba(40,52,72,0)');
            g.fillStyle=grd; g.fillRect(0,0,256,256);
            const tx=new THREE.CanvasTexture(c);

        /* ================= 工具函数 ================= */
        const matCache={};

        // CAD 工程图风格材质：哑光（高粗糙度、零金属/清漆），浅灰表面柔和受光，贴近参考图效果

        /* ================= 法线分裂：硬边锐利 + 曲面平滑 ================= */
        // 直接 computeVertexNormals 会把共享顶点的相邻面法线平均，导致 90° 折弯等硬边被
        // “抹圆”、边缘发糊。此函数按两面夹角阈值分裂共享顶点：夹角 < 阈值(平滑区，如圆角)
        // 继续平滑；夹角 ≥ 阈值(硬边)各自独立法线，从而同时得到锐利棱边 + 圆角连续曲面。
        function computeSplitNormals(geo, thresholdDeg){
            thresholdDeg = thresholdDeg || 40;
            const pos = geo.getAttribute('position');
            const index = geo.getIndex();
            if(!index){ geo.computeVertexNormals(); return geo; }
            const triCount = index.count/3;
            const fn = new Float32Array(triCount*3);
            const A=new THREE.Vector3(),B=new THREE.Vector3(),C=new THREE.Vector3(),e1=new THREE.Vector3(),e2=new THREE.Vector3(),n=new THREE.Vector3();
            for(let t=0;t<triCount;t++){
                A.fromBufferAttribute(pos,index.getX(t*3));
                B.fromBufferAttribute(pos,index.getX(t*3+1));
                C.fromBufferAttribute(pos,index.getX(t*3+2));
                e1.subVectors(B,A); e2.subVectors(C,A); n.crossVectors(e1,e2).normalize();
                fn[t*3]=n.x; fn[t*3+1]=n.y; fn[t*3+2]=n.z;
            }
            const vertTris=new Map();
            for(let t=0;t<triCount;t++)for(let k=0;k<3;k++){
                const v=index.getX(t*3+k); let a=vertTris.get(v); if(!a){a=[];vertTris.set(v,a);} a.push(t);
            }
            const cosT=Math.cos(thresholdDeg*Math.PI/180);
            const outPos=[],outNrm=[],outIdx=[];
            const keyMap=new Map();
            vertTris.forEach((tris,v)=>{
                const cnt=tris.length;
                const parent=new Int32Array(cnt); for(let i=0;i<cnt;i++)parent[i]=i;
                const find=x=>{let r=x;while(parent[r]!==r)r=parent[r];while(parent[x]!==r){const p=parent[x];parent[x]=r;x=p;}return r;};
                for(let i=0;i<cnt;i++)for(let j=i+1;j<cnt;j++){
                    const t1=tris[i],t2=tris[j];
                    const d=fn[t1*3]*fn[t2*3]+fn[t1*3+1]*fn[t2*3+1]+fn[t1*3+2]*fn[t2*3+2];
                    if(d>cosT){const ri=find(i),rj=find(j);if(ri!==rj)parent[ri]=rj;}
                }
                const rep=new Map();
                for(let i=0;i<cnt;i++){
                    const r=find(i);
                    let gv=rep.get(r);
                    if(gv===undefined){
                        let sx=0,sy=0,sz=0;
                        for(let j=0;j<cnt;j++)if(find(j)===r){const t=tris[j];sx+=fn[t*3];sy+=fn[t*3+1];sz+=fn[t*3+2];}
                        const l=Math.hypot(sx,sy,sz)||1;
                        outPos.push(pos.getX(v),pos.getY(v),pos.getZ(v));
                        outNrm.push(sx/l,sy/l,sz/l);
                        gv=outPos.length/3-1;
                        rep.set(r,gv);
                    }
                    keyMap.set(v+':'+tris[i], gv);
                }
            });

                outIdx.push(keyMap.get(index.getX(t*3+k)+':'+t));
            }
            geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(outPos),3));
            geo.setAttribute('normal',new THREE.BufferAttribute(new Float32Array(outNrm),3));
            geo.setIndex(outIdx);

        }

        /* ================= 顶点焊接：缝合相邻面缝隙（修复「线条断裂/面发噪」） ================= */
        // OCCT 对每个面单独网格化，相邻面共享边上的顶点坐标并不完全一致（差 1e-4~1e-2mm），
        // 这些“裂缝”会让 EdgesGeometry 把缝当成边界画出一圈圈碎线，同时光照在缝处断裂产生噪点。
        // 此函数把容差内的近重合顶点合并为一个，彻底闭合裂缝 → 边线干净、曲面平滑。
        function weldBufferGeometry(geo, relTol){
            const pos=geo.getAttribute('position');
            const index=geo.getIndex();
            if(!index) return geo;
            pos.computeBoundingBox();
            const bb=pos.boundingBox;
            const size=Math.max(bb.max.x-bb.min.x, bb.max.y-bb.min.y, bb.max.z-bb.min.z)||1;
            const tol=Math.max(1e-3, Math.min((relTol||1e-4)*size, 0.05));   // 容差随模型尺度缩放并封顶
            const inv=1/tol;

            for(let i=0;i<pos.count;i++){
                const key=Math.round(pos.getX(i)*inv)+'_'+Math.round(pos.getY(i)*inv)+'_'+Math.round(pos.getZ(i)*inv);
                let gi=map.get(key);

                oldToNew[i]=gi;
            }
            const idx=index.array, out=[]; let merged=0;
            for(let i=0;i<idx.length;i+=3){
                const a=oldToNew[idx[i]], b=oldToNew[idx[i+1]], c=oldToNew[idx[i+2]];
                if(a===b||b===c||a===c){ merged++; continue; }   // 去除退化三角形
                out.push(a,b,c);
            }
            if(!out.length || out.length===idx.length && pos.count===outPos.length/3) return geo;
            geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(outPos),3));
            geo.setIndex(new THREE.BufferAttribute(new Uint32Array(out),1));
            return geo;
        }

        /* ================= 落地：网格与地面软阴影贴合模型底部 ================= */
        function updateGround(){

        /* ================= 自适应渲染质量 ================= */

        // 根据面数动态降低像素比/关闭 MSAA，保证加载后交互仍然流畅。
        function adaptQuality(totalT){
            let px = Math.min(devicePixelRatio, 2.0);

        /* ================= 模型加载 ================= */
        function clearAll(){
            [modelGroup,surfaceGroup,bodyColGroup,edgeGroup,wireGroup].forEach(g=>{while(g.children.length){const c=g.children[0];if(c.geometry)c.geometry.dispose();if(c.material){if(Array.isArray(c.material))c.material.forEach(m=>m.dispose());else c.material.dispose();}g.remove(c);}});

        }
        const BIG_MODEL_TRIS = 300000;  // 超过此面数进入"大模型快速模式"：跳过重建/标注/逐边线
        // 用后端返回的真实 BREP 拓扑边绘制 CAD 特征线（圆盘/圆槽/孔的完整轮廓与切边）。
        // 每条边是采样的折线顶点 [x,y,z,...]，连成线段对后用 LineSegments2 渲染。
        // 这是 CAD 视图的关键：EdgesGeometry 只能按三角网格二面角推断，会丢失切边(tangent edge)
        // 与轮廓边(silhouette)，导致圆盘/圆槽边框缺失；拓扑边则完整、准确且与视角无关。
        // 用 LineSegments2（fat line）替代 LineBasicMaterial：浏览器普遍把后者线宽钳制为 1px，
        // 细线在 FXAA 下发虚、模糊；fat line 支持真实像素线宽 + 平滑抗锯齿，线条锐利清晰。
        const edgeLineMats=[];   // 收集所有特征线材质，渲染尺寸/像素比变化时同步更新 resolution
        function makeEdgeLine2(posArray, color, opts){
            opts=opts||{};
            const lg=new LineSegmentsGeometry();
            lg.setPositions(posArray);          // posArray 为成对顶点 [x,y,z,...]，与 LineSegments 一致
            const lm=new LineMaterial({color:color, linewidth:(opts.linewidth||1.5),
                transparent:!!opts.transparent, opacity:(opts.opacity!=null?opts.opacity:1)});
            const sz=renderer.getDrawingBufferSize(new THREE.Vector2());
            lm.resolution.set(sz.x, sz.y);      // 线宽以"像素"为单位，分辨率必须与实际绘制缓冲一致
            edgeLineMats.push(lm);
            const l2=new LineSegments2(lg, lm);
            if(opts.renderOrder!=null) l2.renderOrder=opts.renderOrder;
            return l2;
        }
        function updateEdgeLineResolution(){
            const sz=renderer.getDrawingBufferSize(new THREE.Vector2());
            edgeLineMats.forEach(m=>m.resolution.set(sz.x,sz.y));
        }
        function addFeatureEdges(edges){
            const pts=[];
            const MAX_PTS=200000; // 防超大模型 JSON 爆炸，硬性封顶
            let cnt=0;
            for(const e of (edges||[])){
                const v=e&&e.vertices; if(!v||v.length<6) continue;
                const seg=Math.floor((v.length-3)/3);
                for(let k=0;k+5<v.length && cnt<MAX_PTS;k+=3,cnt++){
                    pts.push(v[k],v[k+1],v[k+2],v[k+3],v[k+4],v[k+5]);
                }
            }
            if(!pts.length) return;
            edgeGroup.add(makeEdgeLine2(new Float32Array(pts), 0x2a2e35));
        }
        function addToScene(solid, idx, bigMode){
            const verts=solid.vertices, tris=solid.triangles;
            // 当前结构体是否携带真实 BREP 拓扑边（后端 step_reader 采样，含全部孔/槽/圆盘轮廓）
            const hasBrep = !!(solid.edges && solid.edges.length);
            if(!verts||verts.length<3||!tris||tris.length<3)return null;
            const geo=new THREE.BufferGeometry();
            geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(verts),3));
            geo.setIndex(new THREE.BufferAttribute(new Uint32Array(tris),1));
            // 顶点焊接：缝合相邻面裂缝，避免边线把缝当边界画碎线、光照在缝处断裂发噪
            // 法线分裂：硬边(折弯/棱)保持锐利、圆角等曲面保持平滑连续，
            // 避免直接 computeVertexNormals 把硬边“抹圆”导致边缘发糊。

            try{

            const bm=new THREE.Mesh(geo.clone(),new THREE.MeshBasicMaterial({color:BODY_COLORS[idx%BODY_COLORS.length],side:THREE.DoubleSide}));
            bm.visible=false; bodyColGroup.add(bm);

            // 只保留主渲染，保证加载即时完成不卡死；小模型保留全部展示功能
            const sgrp=new THREE.Group(); sgrp.visible=false;
            const wm=new THREE.Mesh(geo.clone(),new THREE.MeshBasicMaterial({color:0,wireframe:true,transparent:true,opacity:.08}));wm.visible=false;wireGroup.add(wm);
            if(!bigMode){
                // 表面标注分组（按法向分上/下/侧）——改用分裂后的索引，保证与法线一致
                const pos0=geo.getAttribute('position'), idx=geo.getIndex(), kv={up:[],down:[],side:[]};
                for(let t=0;t<idx.count;t+=3){

                    const ax=pos0.getX(i1)-pos0.getX(i0),ay=pos0.getY(i1)-pos0.getY(i0),az=pos0.getZ(i1)-pos0.getZ(i0);
                    const bx=pos0.getX(i2)-pos0.getX(i0),by=pos0.getY(i2)-pos0.getY(i0),bz=pos0.getZ(i2)-pos0.getZ(i0);

                    kv[kind].push(pos0.getX(i0),pos0.getY(i0),pos0.getZ(i0),pos0.getX(i1),pos0.getY(i1),pos0.getZ(i1),pos0.getX(i2),pos0.getY(i2),pos0.getZ(i2));
                }
                const cols={up:0xff2d2d,down:0x2d6bff,side:0xff9100};

                // 特征边：优先用后端返回的真实 BREP 拓扑边（含圆盘/圆槽/孔的完整轮廓与切边），
                // 仅当无拓扑边（如 STL / 拓扑缺失）时回退到 EdgesGeometry（三角网格二面角推断，会丢切边）。
                if(!hasBrep){
                    try{
                        const eg=new THREE.EdgesGeometry(geo, 40);

                        edgeGroup.add(makeEdgeLine2(eg.getAttribute('position').array, 0x2a2e35));

            addFeatureEdges(solid.edges);

            const entry={mesh,bm,sgrp,name,visible:true,tris:tris.length/3,color:BODY_COLORS[idx%BODY_COLORS.length]};
            bodyEntries.push(entry);

        }

        /* ================= 渲染上传模型 ================= */
        function renderModel(data){
            loadSpin(true);
            setTimeout(()=>{try{
                clearAll();
                curModelPath=data.filepath||null;
                // 记录最近上传/查看的模型路径，供「装配·拼合」的产品结构体自动填入
                window._productPath=curModelPath;
                curInfo={name:data.file_name||'模型',size:data.bbox&&data.bbox.size?[data.bbox.size[0],data.bbox.size[1],data.bbox.size[2]]:[100,100,100]};
                const solids=data.solids||[];
                let all=[];
                for(const s of solids){const v=s.vertices;if(!v)continue;for(let i=0;i<v.length;i+=3)all.push(v[i],v[i+1],v[i+2]);}
                let cx=0,cy=0,cz=0;const n=all.length/3;
                if(n){for(let i=0;i<all.length;i+=3){cx+=all[i];cy+=all[i+1];cz+=all[i+2];}cx/=n;cy/=n;cz/=n;}
                // 先算总面数（纯读，极快），用于决定"大模型快速模式"与自适应渲染质量
                let totalT=0, i=0;
                for(const s of solids){ if(s.triangles) totalT += s.triangles.length/3; i++; }
                const bigMode = totalT > BIG_MODEL_TRIS;
                const centered=solids.map(s=>{
                    const v=s.vertices;
                    if(!v)return s;
                    const cv=new Float32Array(v.length);
                    for(let k=0;k<v.length;k+=3){cv[k]=v[k]-cx;cv[k+1]=v[k+1]-cy;cv[k+2]=v[k+2]-cz;}
                    // 大模型自动跳过 edges 居中（前端已改用 EdgesGeometry，不再使用该数据）
                    return {...s, vertices:Array.from(cv), edges: (s.edges||[]).map(e=>{
                        const ev=e.vertices;if(!ev)return e;
                        const ce=new Float32Array(ev.length);
                        for(let k=0;k<ev.length;k+=3){ce[k]=ev[k]-cx;ce[k+1]=ev[k+1]-cy;ce[k+2]=ev[k+2]-cz;}
                        return {...e,vertices:ce};
                    })};

        /* ================= 装配·拼合（独立渲染组，不干扰单模型视图） ================= */
        const ASM_COLORS={punch:0x3a6fd8, product:0xff8c1a, cavity:0x2ea869};
        const asmGroup=new THREE.Group(); scene.add(asmGroup);
        let asmRoot=null;
        let asmDragMode=false, asmDragPart=null, asmDragStartY=0, asmDragStartZ=0, asmDragSens=1;
        const asmParts={};

        function showAsmStatus(msg,type){const el=document.getElementById('asmStatus');if(!el)return;el.className='status-msg show '+(type||'info');el.textContent=msg;}
        function asmStatusEl(key){return asmRoot?asmRoot.querySelector('.asm-st[data-st="'+key+'"]'):null;}
        function setPartStatus(key,msg,type){const el=asmStatusEl(key);if(!el)return;el.className='status-msg show '+(type||'info');el.textContent=msg;}

        function asmEdgesFlat(edges){
            // 把 BREP 拓扑边采样折线拍平成"成对顶点"数组（与 LineSegments2 一致）
            const pts=[]; let cnt=0; const MAX=200000;
            for(const e of (edges||[])){
                const v=e&&e.vertices; if(!v||v.length<6)continue;
                for(let k=0;k+5<v.length && cnt<MAX;k+=3,cnt++)pts.push(v[k],v[k+1],v[k+2],v[k+3],v[k+4],v[k+5]);
            }
            return pts.length?new Float32Array(pts):null;
        }

        function buildAsmMesh(solid,key){
            const verts=solid.vertices,tris=solid.triangles;
            if(!verts||verts.length<3||!tris||tris.length<3)return null;
            const geo=new THREE.BufferGeometry();
            geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(verts),3));
            geo.setIndex(new THREE.BufferAttribute(new Uint32Array(tris),1));
            // 与单模型视图一致：顶点焊接缝合相邻面裂缝 + 法线分裂（硬边锐利、圆角平滑），
            // 否则装配件曲面发平、接缝发噪、棱边被抹圆。任一步异常均回退，保证可见。
            try{
                weldBufferGeometry(geo, 1e-4);
                computeSplitNormals(geo, 45);
            }catch(e){
                try{ geo.computeVertexNormals(); }catch(_){}
            }
            const col=ASM_COLORS[key]||0x888888;
            // 半透明透视（默认）：不写深度以看清内部结构；polygonOffset 在"实体模式"下防止
            // 特征线与表面共面产生 Z-fighting 闪烁。降低粗糙度 + 环境反射增强体积光泽。
            const mat=new THREE.MeshStandardMaterial({color:col,side:THREE.DoubleSide,transparent:true,opacity:0.5,
                roughness:0.5,metalness:0.05,envMapIntensity:0.4,depthWrite:false,
                polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1});
            const mesh=new THREE.Mesh(geo,mat);
            mesh.userData.asmKey=key;
            const sub=new THREE.Group();
            sub.userData.asmKey=key; sub.userData.meshRef=mesh;
            sub.add(mesh);
            // 特征边：优先用后端真实 BREP 拓扑边（完整圆盘/孔/切边），否则回退 EdgesGeometry。
            // 用同色系深色细线勾勒轮廓，让零件"有骨有肉"，不再是纯色塑料块。
            try{
                let pa=asmEdgesFlat(solid.edges);
                if(!pa){ const eg=new THREE.EdgesGeometry(geo,40); pa=eg.getAttribute('position').array; }
                if(pa&&pa.length){
                    const line=makeEdgeLine2(pa,new THREE.Color(col).multiplyScalar(0.6).getHex(),
                        {transparent:true,opacity:0.85,linewidth:1.4,renderOrder:2});
                    line.userData.asmKey=key;
                    sub.add(line);
                }
            }catch(e){/* 特征边失败不影响部件显示 */}
            return sub;
        }

        function addAsmPart(key,data){
            if(asmParts[key]){asmGroup.remove(asmParts[key].group);}
            const group=new THREE.Group();
            const meshes=[];
            (data.solids||[]).forEach(s=>{const sub=buildAsmMesh(s,key);if(sub){group.add(sub);const mm=sub.userData.meshRef;if(mm)meshes.push(mm);}});
            const b=data.bbox||{min:[0,0,0],max:[0,0,0]};
            asmParts[key]={group,meshes,data,b,baseZ:0,offset:0};
            asmGroup.add(group);
            updateAsmView();
            // 加载后立即按分模面对齐，避免产品坐标偏置(如镜像后 z 很大)导致看不到
            try{ if(asmGroup.children.length>0) arrangeAsm().catch(e=>{}); }catch(e){}
        }

        function updateAsmView(){
            const has=asmGroup.children.length>0;
            [modelGroup,surfaceGroup,bodyColGroup,edgeGroup,wireGroup].forEach(g=>{if(g)g.visible=!has;});
        }

        async function arrangeAsm(){
            const keys=['punch','product','cavity'];
            const present=keys.filter(k=>asmParts[k]);
            if(!present.length){showAsmStatus('请先加载至少一个部件','err');return;}
            // 说明：
            //   首选【后端 BREP 精确自动对齐】：用真实质心+分模面计算每件位移，对任意
            //   导入/任意坐标框架的 STEP 都能正确对准（产品/上/下模分模面共面、配合中心共轴），
            //   彻底解决"下模 Y 错位 / 用户手动导入不同框架"问题。
            //   仅当后端不可用（如文件不在服务器、无 filepath）才回退前端网格近似对齐。
            const parts=present.map(k=>{
                const p=asmParts[k];
                const boxes=(p.meshes||[]).map(m=>{m.geometry.computeBoundingBox();return m.geometry.boundingBox.clone();});
                if(!boxes.length)return null;
                const ov=boxes.reduce((a,b)=>{a.union(b);return a;},new THREE.Box3().makeEmpty());
                let mate,split;
                if(k==='punch'){
                    const core=boxes.reduce((a,b)=>(b.min.z<a.min.z?b:a),boxes[0]);
                    mate=core.getCenter(new THREE.Vector3());
                    split=core.max.z;
                }else{
                    mate=ov.getCenter(new THREE.Vector3());
                    split=ov.max.z;
                }
                return {k,p,boxes,ov,mate,split};
            }).filter(Boolean);
            if(!parts.length){showAsmStatus('部件无可用网格','err');return;}

            // —— 1) 优先：后端 BREP 精确自动对齐（支持任意框架导入） ——
            const fp=p=>asmParts[p]&&asmParts[p].data&&asmParts[p].data.filepath;
            const paths={punch:fp('punch'),product:fp('product'),cavity:fp('cavity')};
            if(paths.punch&&paths.product&&paths.cavity){
                try{
                    const ctl=new AbortController();const timer=setTimeout(()=>ctl.abort(),120*1000);
                    const resp=await fetch('/api/assembly_align',{method:'POST',
                        headers:{'Content-Type':'application/json'},signal:ctl.signal,
                        body:JSON.stringify({punch:paths.punch,product:paths.product,cavity:paths.cavity})});
                    clearTimeout(timer);
                    const d=await resp.json();
                    if(!d.error&&d.offsets){
                        // 应用后端位移：三件统一到基准(上模)的分模面+配合中心
                        parts.forEach(it=>{
                            const off=d.offsets[it.k];
                            const dx=(off&&off[0])||0, dy=(off&&off[1])||0, dz=(off&&off[2])||0;
                            it.p.group.position.set(dx,dy,dz);
                            it.p.baseZ=dz; it.p.offset=0;
                        });
                        // 整体包围盒再居中到原点
                        const gb=asmOffsetsGlobalBox(parts);
                        if(!gb.isEmpty()){
                            const c=gb.getCenter(new THREE.Vector3());
                            parts.forEach(it=>{
                                const p=it.p;
                                p.group.position.x-=c.x;p.group.position.y-=c.y;p.group.position.z-=c.z;
                                p.baseZ=p.group.position.z;
                            });
                        }
                        const big=Math.max((gb.isEmpty()?300:gb.getSize(new THREE.Vector3()).length())*0.5,200);
                        asmSetupSlider(big);
                        fitAsm();
                        showAsmStatus('已按分模面+配合中心自动对齐（自动检测任意框架）。滑条可上下拉开查看。','ok');
                        return;
                    }
                }catch(e){ /* 后端对齐失败 -> 回退前端近似 */ }
            }

            // —— 2) 回退：前端网格近似对齐（同框架 0 平移；不同框架配合特征） ——
            const splits=parts.map(it=>it.split);
            const splitMax=Math.max(...splits), splitMin=Math.min(...splits);
            const zTol=Math.max(2.0, (splitMax-splitMin)*0.05);
            const sameFrame=present.length>=2 && (splitMax-splitMin)<=zTol;
            if(sameFrame){
                parts.forEach(it=>{const p=it.p;p.baseZ=0;p.offset=0;p.group.position.set(0,0,0);});
            }else{
                parts.forEach(it=>{const p=it.p;p.baseZ=-it.split;p.offset=0;
                    p.group.position.set(-it.mate.x,-it.mate.y,p.baseZ);});
            }
            const gb=asmOffsetsGlobalBox(parts);
            if(!gb.isEmpty()){
                const c=gb.getCenter(new THREE.Vector3());
                parts.forEach(it=>{const p=it.p;
                    p.group.position.x-=c.x;p.group.position.y-=c.y;p.group.position.z-=c.z;
                    p.baseZ=p.group.position.z;});
            }
            const big=Math.max((gb.isEmpty()?300:gb.getSize(new THREE.Vector3()).length())*0.5,200);
            asmSetupSlider(big);
            fitAsm();
            showAsmStatus(sameFrame?'三件同框架：0 平移摆放（分模面一致已对齐）。滑动条可上下拉开查看。'
                                  :'三件不同框架：已按配合特征近似对齐。','ok');
        }

        // 用已知实体包围盒平移后求并（避免矩阵未更新）
        function asmOffsetsGlobalBox(parts){
            let gb=new THREE.Box3().makeEmpty();
            parts.forEach(it=>{
                it.boxes.forEach(sb=>{
                    const t=it.p.group.position;
                    gb.union(new THREE.Box3(
                        new THREE.Vector3(sb.min.x+t.x,sb.min.y+t.y,sb.min.z+t.z),
                        new THREE.Vector3(sb.max.x+t.x,sb.max.y+t.y,sb.max.z+t.z)
                    ));
                });
            });
            return gb;
        }
        function asmSetupSlider(big){
            if(asmRoot){
                asmRoot.querySelectorAll('.asm-offset').forEach(sl=>{sl.min=-big;sl.max=big;sl.value=0;});
                asmRoot.querySelectorAll('.asm-offv').forEach(v=>{v.textContent='0';});
            }
        }

        function applyAsmOffset(key,val){
            const p=asmParts[key];if(!p)return;
            p.offset=parseFloat(val)||0;
            p.group.position.z=p.baseZ+p.offset;
            if(asmRoot){const v=asmRoot.querySelector('.asm-offv[data-offv="'+key+'"]');if(v)v.textContent=p.offset.toFixed(0);}
        }

        function setAsmTrans(key,on){
            const p=asmParts[key];if(!p)return;
            p.meshes.forEach(m=>{m.material.transparent=true;m.material.opacity=on?0.5:1;m.material.depthWrite=!on;});
        }

        function clearAsm(){
            Object.keys(asmParts).forEach(k=>{asmGroup.remove(asmParts[k].group);});
            for(const k in asmParts)delete asmParts[k];
            if(asmRoot){
                asmRoot.querySelectorAll('.asm-st').forEach(e=>{e.className='status-msg asm-st';e.textContent='';});
                asmRoot.querySelectorAll('.asm-offset').forEach(e=>{e.value=0;});
                asmRoot.querySelectorAll('.asm-offv').forEach(e=>{e.textContent='0';});
            }
            if(asmDragMode)setAsmDrag(false);
            updateAsmView();
            showAsmStatus('装配已清除。','info');
        }

        function fitAsm(){
            const bb=new THREE.Box3().setFromObject(asmGroup);
            if(bb.isEmpty())return;
            const c=bb.getCenter(new THREE.Vector3());
            const d=bb.getSize(new THREE.Vector3()).length()*1.4+10;
            controls.target.copy(c);
            camera.position.set(c.x+d*.7,c.y+d*.5,c.z+d);
            controls.update();
        }

        function setAsmDrag(on){
            asmDragMode=on;
            const btn=document.getElementById('asmDrag');
            if(btn){btn.textContent=on?'✥ 拖动模式：开（点住部件上下拖）':'✥ 拖动模式：关';btn.classList.toggle('active',on);}
            // 拖动模式开启时禁用轨道控制，鼠标全部用于点选并上下拖拽部件，避免冲突
            controls.enabled=!on;
            if(!on)asmDragPart=null;
        }

        function onAsmPointerDown(e){
            if(!asmDragMode)return;
            const r=renderer.domElement.getBoundingClientRect();
            const m=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
            const ray=new THREE.Raycaster();ray.setFromCamera(m,camera);
            const hits=ray.intersectObjects(asmGroup.children,true);
            if(!hits.length)return;
            const key=hits[0].object.userData.asmKey;
            if(!key||!asmParts[key])return;
            asmDragPart=key;asmDragStartY=e.clientY;
            const p=asmParts[key];asmDragStartZ=p.baseZ+p.offset;
            const dist=camera.position.distanceTo(controls.target)||1;
            asmDragSens=2*dist*Math.tan(camera.fov*Math.PI/360)/Math.max(r.height,1);
            renderer.domElement.setPointerCapture(e.pointerId);
            e.preventDefault();
        }
        function onAsmPointerMove(e){
            if(!asmDragPart||!asmParts[asmDragPart])return;
            const dy=asmDragStartY-e.clientY;
            const p=asmParts[asmDragPart];
            const newOffset=asmDragStartZ+dy*asmDragSens-p.baseZ;
            applyAsmOffset(asmDragPart,newOffset);
            const sl=asmRoot?asmRoot.querySelector('.asm-offset[data-k="'+asmDragPart+'"]'):null;
            if(sl)sl.value=Math.max(parseFloat(sl.min),Math.min(parseFloat(sl.max),newOffset));
        }
        function onAsmPointerUp(){asmDragPart=null;}
        renderer.domElement.addEventListener('pointerdown',onAsmPointerDown);
        renderer.domElement.addEventListener('pointermove',onAsmPointerMove);
        renderer.domElement.addEventListener('pointerup',onAsmPointerUp);
        renderer.domElement.addEventListener('pointercancel',onAsmPointerUp);

        function loadAsmPartFromFile(key,file){
            const ext=file.name.split('.').pop().toLowerCase();
            if(!['stp','step','stl'].includes(ext)){setPartStatus(key,'仅支持 STP/STEP/STL','err');return;}
            setPartStatus(key,'上传解析中...','info');
            const ctl=new AbortController();const timer=setTimeout(()=>ctl.abort(),90*1000);
            const fd=new FormData();fd.append('file',file);
            fetch('/upload',{method:'POST',body:fd,signal:ctl.signal}).then(r=>r.json()).then(d=>{
                clearTimeout(timer);
                if(d.error)throw new Error(d.error);
                addAsmPart(key,d);
                setPartStatus(key,'已加载 '+(d.face_count||0)+' 个面','ok');
                showAsmStatus('部件已载入：'+(d.file_name||key)+'（点「自动拼合」对齐）','info');
            }).catch(e=>{clearTimeout(timer);setPartStatus(key,'失败:'+e.message,'err');});
        }

        function autoAsmPart(key){
            let path=null;
            // 上模/下模：优先用「模具再修理」的结果(_refixFiles)，其次第一次修复(_fixedFiles)，再次生成模具(_moldFiles)
            const pick=(name)=>((window._refixFiles&&window._refixFiles[name])
                                ||(window._fixedFiles&&window._fixedFiles[name])
                                ||(window._moldFiles&&window._moldFiles[name])||null);
            if(key==='punch')path=pick('punch');
            else if(key==='cavity')path=pick('cavity');
            else if(key==='product'){
                // 产品必须与上/下模【同框架】才能正确对齐。从原始 fix_output 模具
                //（PUNCH_FILLED/CAVITY_HOLLOWED，内含与模具同框架的产品实体）提取，
                // 而不是用用户上传的镜像件（另一坐标框架，Y/Z 偏置数万 → 下模错位）。
                const src=((window._fixedFiles&&window._fixedFiles.punch)
                            ||(window._moldFiles&&window._moldFiles.punch)||null);
                if(!src){setPartStatus('product','无原始模具(含同框架产品)，请先生成/修复模具','err');return;}
                setPartStatus('product','从原始模具提取同框架产品...','info');
                fetch('/api/assembly_product_mesh?file='+encodeURIComponent(src)).then(r=>r.json()).then(d=>{
                    if(d.error)throw new Error(d.error);
                    addAsmPart('product',d);
                    setPartStatus('product','已加载同框架产品 '+(d.face_count||0)+' 面','ok');
                    showAsmStatus('产品已从原始模具提取同框架实体（点「自动拼合」对齐）','info');
                }).catch(e=>setPartStatus('product','失败:'+e.message,'err'));
                return;
            }
            if(!path){setPartStatus(key,'无可用文件（请先上传产品 / 生成模具 / 再修理模具）','err');return;}
            setPartStatus(key,'加载中...','info');
            fetch('/api/mesh?file='+encodeURIComponent(path)).then(r=>r.json()).then(d=>{
                if(d.error)throw new Error(d.error);
                addAsmPart(key,d);
                setPartStatus(key,'已加载 '+(d.face_count||0)+' 个面','ok');
                showAsmStatus('部件已载入（点「自动拼合」对齐）','info');
            }).catch(e=>setPartStatus(key,'失败:'+e.message,'err'));
        }
