                    <label class="f" style="margin:0">高Z <input type="number" id="m2Hz" placeholder="自动" style="width:80px"></label>
                    <label class="f" style="margin:0">边距 <input type="number" id="m2Mg" value="5" step="0.5" style="width:60px"></label>
                    <label class="f" style="margin:0"><input type="checkbox" id="m2Export" checked> 导出STEP</label>
                </div>
                <button class="btn" id="m2Btn" style="background:#8d6e63">🛠 生成上/下模（法二）</button>
                <div class="status-msg" id="panelStatus"></div>
                <div style="font-size:12px;background:var(--primary-bg);border-radius:7px;padding:8px;margin-top:12px;color:var(--primary-dark)" id="m2Res"></div>
                <a class="btn" id="m2PunchLink" style="display:none;text-decoration:none" target="_blank">⬇️ 下载上模 STEP</a>
                <a class="btn" id="m2CavityLink" style="display:none;text-decoration:none" target="_blank">⬇️ 下载下模 STEP</a>`},
            holefill:{t:'🕳 孔洞补齐',html:()=>`
                <div class="hint">自动识别导入模型上的所有孔洞（圆形穿孔/盲孔），并自动补齐至与钣金两面【平齐、无超出】。<br>· 遍历所有 360° 完整圆柱面识别孔壁（自动排除折弯圆角）；<br>· 每个孔生成恰好贴合两端面的圆柱补实体并布尔融合；<br>· 识别数为 0 说明模型没有圆形孔（折弯圆角不会误判）。</div>
                <button class="btn" id="hfBtn">🕳 自动补齐所有孔洞</button>
                <div class="status-msg" id="panelStatus"></div>
                <div style="font-size:12px;background:var(--primary-bg);border-radius:7px;padding:8px;margin-top:12px;color:var(--primary-dark)" id="hfRes"></div>
                <a class="btn" id="hfLink" style="display:none;text-decoration:none" target="_blank">⬇️ 下载补齐后模型</a>`},
        };
        /* ============ 多面板管理：支持同时打开多个功能面板，各自保留状态 ============ */
        const panelEl = document.getElementById('panels');
        const backdropEl = document.getElementById('panelBackdrop');
        const panelStack = document.getElementById('panelStack');
        const openPanels = new Set();    // 当前打开的面板名集合
        const builtPanels = new Set();   // 已构建过（首次打开过）的面板名 —— 之后保留其 DOM 与状态

        function buildPanel(name){
            const p=PANELS[name];if(!p)return;
            if(builtPanels.has(name))return;   // 面板只构建一次，避免重复绑定/状态被清空
            const card=document.createElement('div');
            card.className='panel-card';
            card.dataset.panel=name;
            card.innerHTML='<div class="ph">'+p.t+'<button title="关闭该面板" data-act="close">✕</button></div><div class="pb"></div>';
            card.querySelector('[data-act="close"]').onclick=()=>closePanel(name);
            const body=card.querySelector('.pb');
            body.innerHTML=p.html();
            panelStack.appendChild(card);
            builtPanels.add(name);
            bindPanel(name, body);   // 元素查找限定在该面板 body 内，规避多面板重复 id 冲突
        }
        function openPanel(name){
            const p=PANELS[name];if(!p)return;
            buildPanel(name);
            const card=panelStack.querySelector('.panel-card[data-panel="'+name+'"]');
            if(card)card.classList.add('show');
            openPanels.add(name);
            panelEl.classList.add('show');
            backdropEl.classList.add('show');
            document.querySelectorAll('.ha-btn').forEach(b=>b.classList.toggle('active',openPanels.has(b.dataset.panel)));
            document.querySelectorAll('.fn-btn').forEach(b=>b.classList.toggle('active',openPanels.has(b.dataset.panel)));
        }
        function closePanel(name){
            if(name && openPanels.has(name)){
                openPanels.delete(name);
                const card=panelStack.querySelector('.panel-card[data-panel="'+name+'"]');
                if(card)card.classList.remove('show');
                document.querySelectorAll('.ha-btn').forEach(b=>b.classList.toggle('active',openPanels.has(b.dataset.panel)));
                document.querySelectorAll('.fn-btn').forEach(b=>b.classList.toggle('active',openPanels.has(b.dataset.panel)));
                if(!openPanels.size){panelEl.classList.remove('show');backdropEl.classList.remove('show');}
                return;
            }
            if(!name)closeAllPanels();
        }
        function closeAllPanels(){
            openPanels.clear();
            panelStack.querySelectorAll('.panel-card.show').forEach(c=>c.classList.remove('show'));
            panelEl.classList.remove('show');
            backdropEl.classList.remove('show');
            document.querySelectorAll('.ha-btn').forEach(b=>b.classList.remove('active'));
            document.querySelectorAll('.fn-btn').forEach(b=>b.classList.remove('active'));
        }
        window.closeAllPanels=closeAllPanels;
        window.closePanel=closePanel;
        document.addEventListener('keydown',e=>{
            if(e.key==='Escape'&&panelEl.classList.contains('show')){closeAllPanels();e.stopPropagation();}
        });
        function togglePanel(name){
            if(openPanels.has(name))closePanel(name);
            else openPanel(name);
        }
        document.querySelectorAll('.ha-btn').forEach(b=>b.onclick=()=>togglePanel(b.dataset.panel));
        document.querySelectorAll('.fn-btn').forEach(b=>b.onclick=()=>togglePanel(b.dataset.panel));

        // === 运行后自动清理中间产物 开关 ===
        const autoCleanChk=document.getElementById('autoCleanChk');
        if(autoCleanChk){
            fetch('/api/auto_clean',{method:'GET'}).then(r=>r.json()).then(d=>{
                autoCleanChk.checked=!!d.enabled;
            }).catch(()=>{ autoCleanChk.checked=true; });
            autoCleanChk.onchange=async()=>{
                try{
                    await fetch('/api/auto_clean',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:autoCleanChk.checked})});
                }catch(e){ showStatus('开关设置失败:'+e.message,'err',panelEl.querySelector('#panelStatus')||null); }
            };
        }

        function bindPanel(name, root){
            // 作用域化查找：元素都在该面板 card 的 body(root) 内查找，
            // 这样多个面板同时存在于 DOM 时各自重复的 id 不会互相干扰。
            const $=id=>root.querySelector('#'+id);
            if(name==='upload'){
                const area=$('upArea'),file=$('upFile');
                area.onclick=()=>file.click();
                area.ondragover=e=>{e.preventDefault();area.style.borderColor='var(--primary)';};
                area.ondrop=e=>{e.preventDefault();if(e.dataTransfer.files.length)doUpload(e.dataTransfer.files[0],$('panelStatus'));};
                file.onchange=()=>file.files.length&&doUpload(file.files[0],$('panelStatus'));
            }
            if(name==='measure'){
                let pts=[];const ln=new THREE.Group();scene.add(ln);
                const startBtn=$('msStart');
                const statusEl=$('panelStatus');
                const doStart=()=>{
                    pts=[];
                    if(!openPanels.has('measure'))return;
                    startBtn.textContent='🔴 测量中...';
                    const onC=e=>{
                        const r=renderer.domElement.getBoundingClientRect();const m=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
                        const ray=new THREE.Raycaster();ray.setFromCamera(m,camera);const hits=ray.intersectObjects(clickableMeshes);
                        if(!hits.length)return;
                        const p=hits[0].point.clone();pts.push(p);
                        const sp=new THREE.Mesh(new THREE.SphereGeometry(1.6,12,12),new THREE.MeshBasicMaterial({color:0x4f8cf7}));sp.position.copy(p);scene.add(sp);ln.add(sp);
                        if(pts.length>=2){
                            const d=pts[pts.length-2].distanceTo(pts[pts.length-1]);
                            const lg=new THREE.BufferGeometry().setFromPoints([pts[pts.length-2],pts[pts.length-1]]);
                            const line=new THREE.Line(lg,new THREE.LineDashedMaterial({color:0x4f8cf7,dashSize:2,gapSize:1.5}));line.computeLineDistances();scene.add(line);ln.add(line);
                            const cc=document.createElement('canvas');cc.width=256;cc.height=64;const c2=cc.getContext('2d');c2.fillStyle='rgba(255,255,255,.9)';c2.fillRect(0,0,256,64);c2.strokeStyle='#4f8cf7';c2.lineWidth=2;c2.strokeRect(0,0,256,64);c2.fillStyle='#4f8cf7';c2.font='Bold 26px Arial';c2.textAlign='center';c2.textBaseline='middle';c2.fillText(d.toFixed(2)+' mm',128,34);
                            const tx=new THREE.CanvasTexture(cc),lab=new THREE.Sprite(new THREE.SpriteMaterial({map:tx}));lab.scale.set(24,6,1);lab.position.copy(pts[pts.length-2].clone().add(pts[pts.length-1]).multiplyScalar(.5)).add(new THREE.Vector3(0,5,0));scene.add(lab);ln.add(lab);
                            statusEl.textContent='长度 '+d.toFixed(2)+' mm（已记录）';
                        }
                    };
                    renderer.domElement.addEventListener('click',onC);
                    renderer.domElement.onmousemove=e=>{const r=renderer.domElement.getBoundingClientRect();const m=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);const ray=new THREE.Raycaster();ray.setFromCamera(m,camera);renderer.domElement.style.cursor=ray.intersectObjects(clickableMeshes).length?'crosshair':'default';};
                    window._stopMs=()=>{renderer.domElement.removeEventListener('click',onC);startBtn.textContent='🎯 开始测量';};
                };
                startBtn.onclick=()=>{if(startBtn.textContent.includes('测量中')){window._stopMs&&window._stopMs();}else doStart();};
                $('msClear').onclick=()=>{window._stopMs&&window._stopMs();while(ln.children.length){const c=ln.children[0];if(c.geometry)c.geometry.dispose();scene.remove(c);ln.remove(c);}statusEl.textContent='当前值: —';};
            }
            if(name==='cutplane'){
                const dirSel=$('cpDir'),rng=$('cpRange'),v=$('cpV');
                rng.oninput=()=>{v.textContent=(parseFloat(rng.value)/500*100).toFixed(1);};
                $('cpBtn').onclick=async()=>{
                    if(!curModelPath){showStatus('请先上传模型','err',$('panelStatus'));return;}
                    const dir=dirSel.value,norm=dir==='z'?[0,0,1]:dir==='y'?[0,1,0]:[1,0,0];
                    const frac=parseFloat(rng.value)/1000;
                    const bb=new THREE.Box3().setFromObject(modelGroup);
                    const min=bb.min,max=bb.max;
                    const origin=[(min.x+max.x)/2,(min.y+max.y)/2,(min.z+max.z)/2];
                    origin[dir==='z'?2:dir==='y'?1:0]=min[dir==='z'?2:dir==='y'?1:0]+(max[dir==='z'?2:dir==='y'?1:0]-min[dir==='z'?2:dir==='y'?1:0])*frac;
                    showStatus('计算中...','info',$('panelStatus'));
                    try{
                        const resp=await fetch('/api/slice_plane?file='+encodeURIComponent(curModelPath)+'&origin='+origin.map(o=>o.toFixed(3)).join(',')+'&normal='+norm.join(','));
                        const data=await resp.json();if(data.error)throw new Error(data.error);
                        showStatus('展开长度 '+(data.best_length||data.arc_lengths?.reduce((a,b)=>a+b,0)||0).toFixed(2)+' mm（'+(data.contours_3d?.length||0)+' 条轮廓）','ok',$('panelStatus'));
                    }catch(e){showStatus('失败: '+e.message,'err',$('panelStatus'));}
                };
            }
            if(name==='mold'){
                const st1=$('panelStatus'),st2=$('panelStatus2');
                $('mdGen').onclick=async()=>{
                    if(!curModelPath){showStatus('请先上传模型','err',st1);return;}
                    showStatus('生成中（30秒-2分钟）...','info',st1);
                    try{
                        const resp=await fetch('/api/generate_mold',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filepath:curModelPath,side_margin:parseFloat($('mdMargin').value)||10,base_thickness:parseFloat($('mdThick').value)||10})});
                        const d=await resp.json();if(d.error)throw new Error(d.error);
                        const inf=d.info;
                        $('mdRes').innerHTML='✅ 模具已生成<br>📦 产品 '+inf.product_size[0].toFixed(0)+'×'+inf.product_size[1].toFixed(0)+'×'+inf.product_size[2].toFixed(0)+' mm<br>🔻 凹模 '+inf.cavity_size[0].toFixed(0)+'×'+inf.cavity_size[1].toFixed(0)+'×'+inf.cavity_size[2].toFixed(0)+' mm<br>🔺 凸模 '+inf.punch_size[0].toFixed(0)+'×'+inf.punch_size[1].toFixed(0)+'×'+inf.punch_size[2].toFixed(0)+' mm<br><a href="/api/download_mold?file='+encodeURIComponent(d.cavity)+'" style="color:var(--primary)">⬇️ 凹模</a> &nbsp; <a href="/api/download_mold?file='+encodeURIComponent(d.punch)+'" style="color:var(--primary)">⬇️ 凸模</a>';
                        showStatus('模具生成完成！','ok',st1);
                        window._moldFiles={cavity:d.cavity,punch:d.punch};
                    }catch(e){showStatus('失败:'+e.message,'err',st1);}
                };
                $('fxBtn').onclick=async()=>{
                    const t=$('fxTarget').value;if(!t){showStatus('请选择修复对象','err',st2);return;}
                    const f=window._moldFiles?window._moldFiles[t]:null;if(!f){showStatus('请先生成模具','err',st2);return;}
                    const btn=$('fxBtn');
                    btn.disabled=true;btn.textContent='⏳ 修复中...';
                    showStatus('修复中...（凸模补齐约 2~4 分钟，凹模挖空约 1~2 分钟，请耐心等待）','info',st2);
                    $('fxLink').style.display='none';
                    const ctl=new AbortController();
                    const timer=setTimeout(()=>ctl.abort(),600*1000);
                    try{
                        const resp=await fetch('/api/fix_mold',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filepath:f,operation:t==='punch'?'fill':'hollow',product_filepath:curModelPath}),signal:ctl.signal});
                        const d=await resp.json();if(d.error)throw new Error(d.error);
                        const l=$('fxLink');l.href='/api/download_fix?file='+encodeURIComponent(d.output_path);l.style.display='block';
                        showStatus('修复完成！','ok',st2);
                        window._fixedFiles=window._fixedFiles||{};window._fixedFiles[t]=d.output_path;
                    }catch(e){
                        if(e.name==='AbortError')showStatus('❌ 修复超时（超过10分钟）。请确认服务器正在运行，或在 fix_output 目录查看是否已生成文件','err',st2);
                        else showStatus('失败: '+e.message,'err',st2);
                    }finally{
                        clearTimeout(timer);
                        btn.disabled=false;btn.textContent='🔧 执行修复';
                    }
                };
            }
            if(name==='mirror'){
                $('mrBtn').onclick=async()=>{
                    if(!curModelPath){showStatus('请先上传模型','err',$('panelStatus'));return;}
                    showStatus('生成中...','info',$('panelStatus'));
                    try{
                        const resp=await fetch('/api/generate_mirror',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filepath:curModelPath,plane:$('mrPlane').value,center_on_centroid:$('mrCenter').checked})});
                        const d=await resp.json();if(d.error)throw new Error(d.error);
                        const l=$('mrLink');l.href='/api/download_mirror?file='+encodeURIComponent(d.output_path);l.style.display='block';
                        showStatus('镜像完成！','ok',$('panelStatus'));
                    }catch(e){showStatus('失败:'+e.message,'err',$('panelStatus'));}
                };
                $('rotBtn').onclick=async()=>{
                    if(!curModelPath){showStatus('请先上传模型','err',$('panelStatusRot'));return;}
                    const angle=parseFloat($('rotAngle').value);
                    if(!(angle>0)){showStatus('请输入大于 0 的旋转角度','err',$('panelStatusRot'));return;}
                    showStatus('旋转中...','info',$('panelStatusRot'));
                    try{
                        const resp=await fetch('/api/generate_rotate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filepath:curModelPath,axis:$('rotAxis').value,angle:angle,clockwise:$('rotDir').value==='cw',center_on_centroid:$('rotCenter').checked})});
                        const d=await resp.json();if(d.error)throw new Error(d.error);
                        const l=$('rotLink');l.href='/api/download_rotate?file='+encodeURIComponent(d.output_path);l.style.display='block';
                        showStatus('旋转完成！','ok',$('panelStatusRot'));
                    }catch(e){showStatus('失败:'+e.message,'err',$('panelStatusRot'));}
                };
            }
            if(name==='corner'){
                const st=$('panelStatus'),res=$('ccRes'),lnk=$('ccLink');
                const payload=()=>JSON.stringify({filepath:curModelPath,extend_mm:parseFloat($('ccExtend').value)||6,gap_tol:parseFloat($('ccGapTol').value)||0.15,mode:$('ccMode').value});
                $('ccCheck').onclick=async()=>{
                    if(!curModelPath){showStatus('请先上传模型','err',st);return;}
                    res.innerHTML='';lnk.style.display='none';
                    showStatus('检测中...','info',st);
                    try{
                        const resp=await fetch('/api/corner_close',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filepath:curModelPath,check_only:true,extend_mm:parseFloat($('ccExtend').value)||6,gap_tol:parseFloat($('ccGapTol').value)||0.15})});
                        const d=await resp.json();if(d.error)throw new Error(d.error);
                        const gapTxt=(d.gaps||[]).map(g=>'面['+g.faces.join(',')+'] 间隙 '+g.gap_mm.toFixed(2)+'mm 二面角 '+g.angle_deg+'° '+(g.closable?'✅可闭合':'⛔需加大延伸')).join('<br>')||'未检测到开放角落';
                        res.innerHTML='检测到 '+d.total_corners+' 个角落（可闭合 '+d.closable_corners+' 个）<br>板厚 '+d.thickness+'mm<br>'+gapTxt;
                        showStatus('检测完成','ok',st);
                    }catch(e){showStatus('失败: '+e.message,'err',st);}
                };
                $('ccFix').onclick=async()=>{
                    if(!curModelPath){showStatus('请先上传模型','err',st);return;}
                    res.innerHTML='';lnk.style.display='none';
                    const btn=$('ccFix');btn.disabled=true;btn.textContent='⏳ 修复中...';
                    showStatus('修复中（角落闭合，请耐心等待）...','info',st);
                    const ctl=new AbortController();const timer=setTimeout(()=>ctl.abort(),600*1000);
                    try{
                        const resp=await fetch('/api/corner_close',{method:'POST',headers:{'Content-Type':'application/json'},body:payload(),signal:ctl.signal});
                        const d=await resp.json();if(d.error)throw new Error(d.error);
                        if(d.output_path){lnk.href='/api/download_corner_close?file='+encodeURIComponent(d.output_path);lnk.style.display='block';}
                        res.innerHTML='识别角落 '+d.detected_corners+'，成功修复 '+d.success_corners+'，失败 '+d.failed_corners+' 个<br>体积 '+d.original_volume.toFixed(1)+' → '+d.repaired_volume.toFixed(1)+' mm³（+'+d.added_volume.toFixed(1)+'）<br>板厚 '+d.thickness+'mm，形状有效';
                        showStatus('角落闭合修复完成！','ok',st);
                    }catch(e){
                        if(e.name==='AbortError')showStatus('❌ 修复超时（超过10分钟）','err',st);
                        else showStatus('失败: '+e.message,'err',st);
                    }finally{clearTimeout(timer);btn.disabled=false;btn.textContent='🛠 执行角落闭合修复';}
                };
            }
            if(name==='assembly'){
                asmRoot=root;
                root.querySelectorAll('[data-act="pick"]').forEach(b=>{
                    b.onclick=()=>{const fi=root.querySelector('.asm-file[data-k="'+b.dataset.k+'"]');if(fi)fi.click();};
                });
                root.querySelectorAll('.asm-file').forEach(fi=>{
                    fi.onchange=()=>{if(fi.files.length)loadAsmPartFromFile(fi.dataset.k,fi.files[0]);};
                });
                root.querySelectorAll('[data-act="auto"]').forEach(b=>{
                    b.onclick=()=>autoAsmPart(b.dataset.k);
                });
                root.querySelectorAll('.asm-trans').forEach(cb=>{
                    cb.onchange=()=>setAsmTrans(cb.dataset.k,cb.checked);
                });
                root.querySelectorAll('.asm-offset').forEach(sl=>{
                    sl.oninput=()=>applyAsmOffset(sl.dataset.k,sl.value);
                });
                document.getElementById('asmAssemble').onclick=arrangeAsm;
                document.getElementById('asmDrag').onclick=()=>setAsmDrag(!asmDragMode);
                document.getElementById('asmClear').onclick=clearAsm;
                // 输出装配吻合结构体 STEP（再修理后的上模 + 产品 + 再修理后的下模）
                document.getElementById('asmBuild').onclick=async()=>{
                    const stEl=document.getElementById('asmBuildStatus'),lk=document.getElementById('asmBuildLink');
                    const set=m=>{if(stEl)stEl.textContent=m;};
                    const pick=(name)=>((window._refixFiles&&window._refixFiles[name])
                                 ||(window._fixedFiles&&window._fixedFiles[name])
                                 ||(window._moldFiles&&window._moldFiles[name])||null);
                    // 再修理后的上模/下模优先；无再修理则退回第一次修复/生成模具（仍可装配）
                    const punch=pick('punch'),cavity=pick('cavity');
                    // 原始 fix_output 模具（含同框架产品实体）：优先第一次修复，其次生成模具
                    const prodSrc=((window._fixedFiles&&window._fixedFiles.punch)
                              ||(window._moldFiles&&window._moldFiles.punch)||null);
                    if(!punch||!cavity){set('请先执行「模具再修理」或上传并生成/修复上下模。');return;}
                    if(!prodSrc){set('未找到原始模具（含产品实体）。请先执行「模具修复」。');return;}
                    const btn=document.getElementById('asmBuild');btn.disabled=true;btn.textContent='⏳ 生成合拢装配体...';set('正在生成（可能耗时数十秒）...');
                    try{
                        const resp=await fetch('/api/build_assembly',{method:'POST',headers:{'Content-Type':'application/json'},
                            body:JSON.stringify({punch:punch,cavity:cavity,product_src:prodSrc,fuse:false})});
                        const d=await resp.json();
                        if(d.error)throw new Error(d.error);
                        if(d.assembly){lk.href='/api/download_assembly?file='+encodeURIComponent(d.assembly);lk.style.display='block';}
                        set('✅ 合拢装配体已生成：'+d.assembly_solid_count+' 结构体，三对干涉=0'+(d.max_gap!=null?'，最大间隙 '+d.max_gap+'mm':'')+'（点下方按钮下载）');
                    }catch(e){set('❌ 生成失败:'+e.message);}
                    finally{btn.disabled=false;btn.textContent='📦 输出装配体(STEP)';}
                };
                setAsmDrag(false);
            }
            if(name==='refix'){
                const st=$('panelStatus'),res=$('rxRes'),
                      l1=$('rxPunchLink'),l2=$('rxCavityLink');
                const up=async f=>{
                    const fd=new FormData();fd.append('file',f);
                    const resp=await fetch('/upload',{method:'POST',body:fd});
                    const d=await resp.json();if(d.error)throw new Error(d.error);
                    return d.filepath;
                };
                $('rxBtn').onclick=async()=>{
                    const pf=$('rxPunch').files[0],cf=$('rxCavity').files[0];
                    if(!pf||!cf){showStatus('请先选择【上模】与【下模】两个 STEP 文件','err',st);return;}
                    const btn=$('rxBtn');btn.disabled=true;btn.textContent='⏳ 上传中...';
                    res.innerHTML='';l1.style.display='none';l2.style.display='none';
                    const ctl=new AbortController();const timer=setTimeout(()=>ctl.abort(),900*1000);
                    try{
                        showStatus('上传上模/下模...','info',st);
                        const [pp,cav]=await Promise.all([up(pf),up(cf)]);
                        btn.textContent='⏳ 再修理中（可能几分钟）...';
                        showStatus('再修理中（去除产品结构体）...','info',st);
                        const resp=await fetch('/api/mold_refix',{method:'POST',
                            headers:{'Content-Type':'application/json'},
                            body:JSON.stringify({punch_filepath:pp,cavity_filepath:cav,
                                corner_fill:false}),
                            signal:ctl.signal});
                        const d=await resp.json();if(d.error)throw new Error(d.error);
                        if(d.punch_output){l1.href='/api/download_refix?file='+encodeURIComponent(d.punch_output);l1.style.display='block';}
                        if(d.cavity_output){l2.href='/api/download_refix?file='+encodeURIComponent(d.cavity_output);l2.style.display='block';}
                        // 记录再修理结果，供「装配·拼合」自动填入(上模/下模)
                        window._refixFiles=window._refixFiles||{};
                        window._refixFiles.punch=d.punch_output||window._refixFiles.punch;
                        window._refixFiles.cavity=d.cavity_output||window._refixFiles.cavity;
                        res.innerHTML='✅ 再修理完成：已剔除上/下模内的产品结构体。<br>可到「🧩 装配」用【自动】填入再修理后的上模/下模。';
                        showStatus('再修理完成！','ok',st);
                    }catch(e){
                        if(e.name==='AbortError')showStatus('❌ 再修理超时（超过15分钟）','err',st);
                        else showStatus('失败: '+e.message,'err',st);
                    }finally{clearTimeout(timer);btn.disabled=false;btn.textContent='🛠 执行再修理';}
                };
            }
            if(name==='contact'){
                const st=$('panelStatus'), res=$('cfRes'),
                      lP=$('cfPunchLink'), lC=$('cfCavityLink'), lR=$('cfReportLink');
                const up=async f=>{
                    const fd=new FormData();fd.append('file',f);
                    const resp=await fetch('/upload',{method:'POST',body:fd});
                    const d=await resp.json();if(d.error)throw new Error(d.error);
                    return d.filepath;
                };
                const hidLinks=()=>{lP.style.display='none';lC.style.display='none';lR.style.display='none';};
                $('cfBtn').onclick=async()=>{
                    const pf=$('cfProduct').files[0];
                    if(!pf){showStatus('请选择【产品】STEP 文件','err',st);return;}
                    const exportStep=$('cfExport').checked;
                    const btn=$('cfBtn');btn.disabled=true;btn.textContent='⏳ 上传中...';
                    hidLinks();res.innerHTML='';
                    const ctl=new AbortController();const timer=setTimeout(()=>ctl.abort(),900*1000);
                    try{
                        showStatus('上传文件...','info',st);
                        const pfp=await up(pf);
                        btn.textContent='⏳ 提取形变配合面（可能几分钟）...';
                        showStatus('提取形变配合面中...','info',st);
                        const resp=await fetch('/api/extract_contact_faces',{method:'POST',
                            headers:{'Content-Type':'application/json'},
                            body:JSON.stringify({product_filepath:pfp,
                                export_step:exportStep}),
                            signal:ctl.signal});
                        const d=await resp.json();if(d.error)throw new Error(d.error);
                        let html='✅ 提取完成：<br>';
                        (d.summary||[]).forEach(s=>{
                            const kn=s.kind==='punch'?'凸模':'凹模';
                            html+=`　· ${kn}：配合面 ${s.contact_face_count} 片，总贴合面积 ${Number(s.total_contact_area_mm2).toFixed(4)} mm²<br>`;
                        });
                        (d.entries||[]).forEach(e=>{
                            if(e.step){
                                const link=e.kind==='punch'?lP:lC;
                                link.href='/api/download_contact_faces?file='+encodeURIComponent(e.step);
                                link.style.display='block';
                            }
                        });
                        if(d.report){lR.href='/api/download_contact_faces?file='+encodeURIComponent(d.report);lR.style.display='block';}
                        res.innerHTML=html+'<br>点下方按钮下载 STEP / JSON 报告。';
                        showStatus('提取完成！','ok',st);
                    }catch(e){
                        if(e.name==='AbortError')showStatus('❌ 提取超时（超过15分钟）','err',st);
                        else showStatus('失败: '+e.message,'err',st);
                    }finally{clearTimeout(timer);btn.disabled=false;btn.textContent='📐 提取形变配合面';}
                };
            }
            if(name==='m2'){
                const st=$('panelStatus'), res=$('m2Res'),
                      lP=$('m2PunchLink'), lC=$('m2CavityLink');
                const up=async f=>{
                    const fd=new FormData();fd.append('file',f);
                    const resp=await fetch('/upload',{method:'POST',body:fd});
                    const d=await resp.json();if(d.error)throw new Error(d.error);
                    return d.filepath;
                };
                const hidLinks=()=>{lP.style.display='none';lC.style.display='none';};
                $('m2Btn').onclick=async()=>{
                    const pf=$('m2Product').files[0], uf=$('m2Upper').files[0], lf=$('m2Lower').files[0];
                    if(!pf&&!uf&&!lf){showStatus('请选择【产品】STEP（推荐·法二B），或【上形变面】/【下形变面】','err',st);return;}
                    const num=id=>{const v=$(id).value;return (v===''||v==null)?null:parseFloat(v);};
                    const exportStep=$('m2Export').checked;
                    const btn=$('m2Btn');btn.disabled=true;btn.textContent='⏳ 上传中...';
                    hidLinks();res.innerHTML='';
                    const ctl=new AbortController();const timer=setTimeout(()=>ctl.abort(),900*1000);
                    try{
                        showStatus('上传文件...','info',st);
                        const pfp=pf?await up(pf):null, ufp=uf?await up(uf):null, lfp=lf?await up(lf):null;
                        btn.textContent='⏳ 生成模具（法二，可能几分钟）...';
                        showStatus('生成模具（法二）中...','info',st);
                        const resp=await fetch('/api/generate_mold_method2',{method:'POST',
                            headers:{'Content-Type':'application/json'},
                            body:JSON.stringify({product_filepath:pfp,upper_filepath:ufp,lower_filepath:lfp,
                                h1:num('m2H1'),h_cavity:num('m2Hc'),
                                base_lx:num('m2Lx'),base_ly:num('m2Ly'),base_hz:num('m2Hz'),
                                margin:parseFloat($('m2Mg').value||'5'),export_step:exportStep}),
                            signal:ctl.signal});
                        const d=await resp.json();if(d.error)throw new Error(d.error);
                        let html='✅ 生成完成：<br>';
                        (d.summary||[]).forEach(s=>{
                            const kn=s.kind==='punch'?'上模':'下模';
                            let tip='';
                            if(s.kind==='punch'&&s.details){
                                tip = (s.details.src==='protrusion')
                                    ? '<span style="color:#2e7d32">（✅ 贴合产品上表面随形凸起，1实体1壳）</span>'
                                    : '<span style="color:#c62828">（⚠️ 贴合凸起构造失败，已回退为稳定实体块）</span>';
                            }
                            html+=`　· ${kn}：体积 ${Number(s.volume).toFixed(2)} mm³ ${tip}<br>`;
                        });
                        (d.entries||[]).forEach(e=>{
                            if(e.step){
                                const link=e.kind==='punch'?lP:lC;
                                link.href='/api/download_mold_method2?file='+encodeURIComponent(e.step);
                                link.style.display='block';
                            }
                        });
                        res.innerHTML=html+'<br>点下方按钮下载 STEP。';
                        showStatus('生成完成！','ok',st);
                    }catch(e){
                        if(e.name==='AbortError')showStatus('❌ 生成超时（超过15分钟）','err',st);
                        else showStatus('失败: '+e.message,'err',st);
                    }finally{clearTimeout(timer);btn.disabled=false;btn.textContent='🛠 生成上/下模（法二）';}
                };

                /* ================= 多方法自动生成（接 moldkit 方法注册表） ================= */
                const mkSt=$('panelStatus'), mkSum=$('mkSummary'), mkArts=$('mkArts'), mkLog=$('mkLog');
                let MK=[], mkChosen=new Set(), mkTimer=null, mkJob=null;
                const mkEsc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
                const mkForm=methods=>{
                    const fd=new FormData();
                    methods.forEach(m=>fd.append('methods',m));
                    fd.append('part_name',$('mkName').value||'');
                    const put=(k,id)=>{const f=$(id).files[0];if(f)fd.append(k,f);};
                    put('product','mkProduct');put('upper','mkUpper');put('lower','mkLower');
                    document.querySelectorAll('#mkParams input[data-pk]').forEach(e=>fd.append('p.'+e.dataset.pk,e.value));
                    document.querySelectorAll('#mkExtra input[type=file]').forEach(e=>{
                        if(e.files&&e.files[0])fd.append(e.dataset.xk,e.files[0]);
                    });
                    return fd;
                };
                const mkRenderParams=()=>{
                    let html='';
                    mkChosen.forEach(n=>{
                        const m=MK.find(x=>x.name===n);
                        if(!m||!(m.params||[]).length)return;
                        const xtra=(m.extra_inputs||[]).map(x=>x.key);
                        html+='<div style="border-left:2px solid var(--border);padding-left:10px;margin:8px 0"><b>'+mkEsc(m.label)+'</b>';
                        m.params.forEach(p=>{
                            if(xtra.indexOf(p.name)>=0)return;
                            html+='<label class="f" style="margin:4px 0 0">'+mkEsc(p.label)+(p.unit?' ('+p.unit+')':'')+'</label>'
                                 +'<input type="text" data-pk="'+p.name+'" value="'+mkEsc(p.default)+'" style="width:100%">';
                        });
                        html+='</div>';
                    });
                    $('mkParams').innerHTML=html;
                };
                const mkRender=s=>{
                    let h='<table style="width:100%;border-collapse:collapse;font-size:12px">'
                        +'<tr style="color:#888"><th align="left">方法</th><th align="left">结果</th>'
                        +'<th align="left">上模 mm³</th><th align="left">下模 mm³</th>'
                        +'<th align="left">干涉</th><th align="left">贴合度</th></tr>';
                    Object.keys(s.results||{}).forEach(n=>{
                        const o=s.results[n], rep=((o.metrics||{}).report)||{};
                        const pu=rep.punch, ca=rep.cavity, pr=rep.pair||{};
                        const co=(rep.punch_conformity&&rep.punch_conformity.ratio!=null)
                            ?(rep.punch_conformity.ratio*100).toFixed(1)+'%':'—';
                        h+='<tr><td>'+mkEsc(n)+'</td>'
                          +'<td style="color:'+(o.ok?'#2e7d32':'#c62828')+'">'+(o.ok?'成功':'失败')+'</td>'
                          +'<td>'+(pu?Math.round(pu.volume_mm3).toLocaleString():'—')+'</td>'
                          +'<td>'+(ca?Math.round(ca.volume_mm3).toLocaleString():'—')+'</td>'
                          +'<td>'+(pr.interference_mm3!=null?Number(pr.interference_mm3).toFixed(3):'—')+'</td>'
                          +'<td>'+co+'</td></tr>';
                        if(!o.ok)h+='<tr><td colspan="6" style="color:#c62828">'+mkEsc(o.error||'')+'</td></tr>';
                    });
                    mkSum.innerHTML=h+'</table>';
                    mkArts.innerHTML=(s.artifacts||[]).filter(f=>/\.stp$/i.test(f.name)).map(f=>
                        '<a href="/api/moldkit/file/'+s.id+'/'+encodeURIComponent(f.name)+'?download=1" '
                        +'style="display:inline-block;margin:3px 4px 0 0;padding:3px 8px;border:1px solid var(--border);'
                        +'border-radius:5px;text-decoration:none;color:inherit">'+mkEsc(f.name)
                        +' ('+Math.round(f.size/1024)+'KB)</a>').join('');
                };
                const mkPoll=async()=>{
                    try{
                        const s=await (await fetch('/api/moldkit/job/'+mkJob)).json();
                        mkLog.textContent=(s.log||[]).join('\n');mkLog.scrollTop=1e9;
                        showStatus((s.status==='running'?'运行中…':s.status==='done'?'✅ 完成':'❌ 失败')+'  '+s.elapsed+'s',
                                   s.status==='running'?'info':(s.status==='done'?'ok':'err'),mkSt);
                        if(s.status!=='running'){
                            clearInterval(mkTimer);mkTimer=null;mkRender(s);
                            $('mkRun').disabled=false;$('mkAll').disabled=false;
                        }
                    }catch(e){}
                };
                const mkStart=async methods=>{
                    if(!methods.length){showStatus('请先勾选方法','err',mkSt);return;}
                    mkSum.innerHTML='';mkArts.innerHTML='';
                    $('mkRun').disabled=true;$('mkAll').disabled=true;
                    showStatus('提交任务…','info',mkSt);mkLog.textContent='提交任务…';
                    try{
                        const d=await (await fetch('/api/moldkit/run',{method:'POST',body:mkForm(methods)})).json();
                        if(d.error)throw new Error(d.error);
                        mkJob=d.job;
                        if(mkTimer)clearInterval(mkTimer);
                        mkTimer=setInterval(mkPoll,900);
                    }catch(e){
                        showStatus('失败: '+e.message,'err',mkSt);
                        $('mkRun').disabled=false;$('mkAll').disabled=false;
                    }
                };
                const mkLoad=async()=>{
                    try{
                        const d=await (await fetch('/api/moldkit/methods')).json();
                        if(d.error){$('mkMethods').innerHTML='<span style="color:#c62828">'+mkEsc(d.error)+'</span>';return;}
                        MK=d.methods||[];
                        $('mkMethods').innerHTML=MK.map(m=>
                            '<label style="display:block;cursor:'+(m.available?'pointer':'not-allowed')+';'
                            +(m.available?'':'opacity:.45')+'">'
                            +'<input type="checkbox" data-mk="'+m.name+'"'+(m.available?'':' disabled')+'> '
                            +'<b>'+mkEsc(m.label)+'</b> <span style="color:#888">['+mkEsc(m.engine)+']</span>'
                            +(m.desc?'<br><span style="color:#888;margin-left:20px">'+mkEsc(m.desc)+'</span>':'')
                            +(m.cons?'<br><span style="color:#c77;margin-left:20px">限制：'+mkEsc(m.cons)+'</span>':'')
                            +(m.available?'':'<br><span style="color:#c62828;margin-left:20px">不可用：'
                                          +mkEsc(m.unavailable_reason||'')+'</span>')
                            +'</label>').join('');
                        $('mkMethods').querySelectorAll('input[data-mk]').forEach(cb=>{
                            cb.onchange=()=>{
                                cb.checked?mkChosen.add(cb.dataset.mk):mkChosen.delete(cb.dataset.mk);
                                mkRenderParams();
                            };
                        });
                        const extra=[];
                        MK.forEach(m=>(m.extra_inputs||[]).forEach(x=>{
                            if(!extra.some(y=>y.key===x.key))extra.push(x);
                        }));
                        $('mkExtra').innerHTML=extra.map(x=>
                            '<label class="f">'+mkEsc(x.label)+'</label>'
                            +'<input type="file" data-xk="'+x.key+'" accept="'+(x.accept||'.stp,.step')
                            +'" style="width:100%">').join('');
                    }catch(e){
                        $('mkMethods').innerHTML='<span style="color:#c62828">加载失败: '+mkEsc(e.message)+'</span>';
                    }
                };
                mkLoad();
                $('mkRun').onclick=()=>mkStart(Array.from(mkChosen));
                $('mkAll').onclick=()=>mkStart(MK.filter(m=>m.available).map(m=>m.name));
                /* ================= 多方法逻辑结束 ================= */
            }
            if(name==='holefill'){
                const st=$('panelStatus'),res=$('hfRes'),lnk=$('hfLink');
                $('hfBtn').onclick=async()=>{
                    if(!curModelPath){showStatus('请先上传模型','err',st);return;}
                    showStatus('识别并补齐孔洞中...','info',st);res.innerHTML='';
                    try{
                        const resp=await fetch('/api/generate_hole_fill',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filepath:curModelPath})});
                        const d=await resp.json();if(d.error)throw new Error(d.error);
                        if(d.hole_count===0){
                            res.innerHTML='✅ 未检测到圆形孔洞（模型可能只有折弯圆角，无穿孔）。';
                            showStatus('完成：未发现孔洞','ok',st);return;
                        }
                        lnk.href='/api/download_hole_fill?file='+encodeURIComponent(d.output_path);
                        lnk.style.display='block';
                        const dia=[...new Set(d.holes.map(h=>'Φ'+h.diameter))].join(' / ');
                        res.innerHTML='✅ 识别 '+d.hole_count+' 个孔洞，成功补齐 '+d.filled_count+' 个'+(d.skipped_count?('，跳过 '+d.skipped_count+' 个'):'')+'。<br>'
                                    +'　· 孔：'+dia+'<br>'
                                    +'　· 体积：'+Number(d.volume_before).toFixed(0)+' → '+Number(d.volume_after).toFixed(0)+' mm³<br>'
                                    +'　· BRepCheck 有效：'+(d.valid?'✅':'⚠️')+'<br>下方可下载补齐后模型。';
                        showStatus('孔洞补齐完成！','ok',st);
                    }catch(e){showStatus('失败:'+e.message,'err',st);}
                };
            }
        }

        async function doUpload(file, statusEl){
            const ext=file.name.split('.').pop().toLowerCase();
            if(!['stp','step','stl'].includes(ext)){showStatus('仅支持 STP/STEP/STL','err',statusEl);return;}
            loadSpin(true);showStatus('上传中...','info',statusEl);
            const ctl=new AbortController();
            const timer=setTimeout(()=>ctl.abort(),150*1000);
            try{
                const fd=new FormData();fd.append('file',file);
                const resp=await fetch('/upload',{method:'POST',body:fd,signal:ctl.signal});
                clearTimeout(timer);
                const data=await resp.json();if(data.error)throw new Error(data.error);
                renderModel(data);
                showStatus('已加载 '+(data.face_count||0)+' 个面','ok',statusEl);
            }catch(e){
                clearTimeout(timer);
                if(e.name==='AbortError')showStatus('❌ 上传超时（服务器解析太久已放弃）。建议：在 CAD 中精简模型，或导出为 STL 再上传','err',statusEl);
                else showStatus('❌ '+e.message,'err',statusEl);
            }
            finally{loadSpin(false);}
        }

        /* ================= 动画 ================= */
        function animate(){requestAnimationFrame(animate);controls.update();composer.render();}
        animate();
        function demoBox(){
            const geo=new THREE.BoxGeometry(100,50,30);
            const mesh=new THREE.Mesh(geo,getMat(modelColor));mesh.userData.isModel=true;modelGroup.add(mesh);clickableMeshes.push(mesh);
            const eg=new THREE.EdgesGeometry(geo);edgeGroup.add(makeEdgeLine2(eg.getAttribute('position').array,0x2a2e35));
            curInfo={name:'演示长方体',size:[100,50,30]};fit(100);updateGround();
        }
        demoBox();
        console.log('3D Viewer v3');
    </script>
</body>
</html>
